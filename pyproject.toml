[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "termwatch"
version = "0.1.0"
description = "Monitor long-running terminal processes from your phone."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TermWatch contributors" }]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
termwatch = "termwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/termwatch"]
# The built dashboard is git-ignored, so it must be declared as an artifact to be packaged.
artifacts = ["backend/src/termwatch/web/**"]

[tool.hatch.build.targets.sdist]
include = ["backend/src", "frontend", "docs", "tests", "README.md", "LICENSE"]
exclude = ["frontend/node_modules"]
artifacts = ["backend/src/termwatch/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"
filterwarnings = [
  # Raised by Starlette's TestClient about its own httpx dependency; not actionable here.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["termwatch"]
